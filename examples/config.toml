# MonoLake Configuration
# HTTP/HTTPS proxy supporting URI, Socket, and Unix Domain Socket upstreams

[runtime]
runtime_type = "legacy"
worker_threads = 2
entries = 512

# HTTP Proxy Server
[servers.http_proxy]
name = "monolake-demo"
proxy_type = "http"
listener = { type = "socket", value = "0.0.0.0:8080" }
upstream_http_version = "http11"
http_opt_handlers = { content_handler = true }

[servers.http_proxy.http_timeout]
server_keepalive_timeout_sec = 60
upstream_connect_timeout_sec = 5
upstream_read_timeout_sec = 10

# Socket upstream demo
[[servers.http_proxy.routes]]
path = "/socket"
upstreams = [{ endpoint = { type = "socket", value = "127.0.0.1:6153" } }]

# URI upstream demo
[[servers.http_proxy.routes]]
path = "/uri"
upstreams = [{ endpoint = { type = "uri", value = "http://httpbin.org/ip" } }]

# Unix Domain Socket upstream demo
[[servers.http_proxy.routes]]
path = "/unix"
upstreams = [{ endpoint = { type = "unix", value = "/tmp/test.sock" } }]

# Load balancing demo (mixed types)
[[servers.http_proxy.routes]]
path = "/balance"
upstreams = [
    { endpoint = { type = "socket", value = "127.0.0.1:6153" } },
    { endpoint = { type = "uri", value = "http://httpbin.org/ip" } },
    { endpoint = { type = "unix", value = "/tmp/test.sock" } }
]
load_balancer = "round_robin"

# Default route
[[servers.http_proxy.routes]]
path = "/"
upstreams = [{ endpoint = { type = "uri", value = "http://httpbin.org/ip" } }]

# HTTPS Proxy Server (requires certificates)
[servers.https_proxy]
name = "secure-proxy"
proxy_type = "http"
listener = { type = "socket", value = "0.0.0.0:8081" }
tls = { chain = "/app/certs/server.crt", key = "/app/certs/server.pkcs8" }
upstream_http_version = "http2"
http_opt_handlers = { content_handler = true }

[servers.https_proxy.http_timeout]
server_keepalive_timeout_sec = 60
upstream_connect_timeout_sec = 5
upstream_read_timeout_sec = 10

[[servers.https_proxy.routes]]
path = "/secure"
upstreams = [{ endpoint = { type = "uri", value = "https://httpbin.org/ip" } }]

[[servers.https_proxy.routes]]
path = "/"
upstreams = [{ endpoint = { type = "uri", value = "https://httpbin.org" } }] 